spring:
  application:
    name: SimpleTaskManager
  datasource:
    url: jdbc:postgresql://localhost:5432/taskmanager
    username: user
    password: pass
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  data:
    redis:
      host: localhost
      port: 6379
  cache:
    type: redis
    redis:
      time-to-live: 60000

springdoc:
  swagger-ui:
    path: /swagger-ui.html